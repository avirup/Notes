<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111111"/>
    </marker>
    <style>
      .title { font: 700 24px 'Times New Roman', serif; fill: #111111; }
      .label { font: 18px 'Arial', sans-serif; fill: #111111; }
      .small { font: 15px 'Arial', sans-serif; fill: #111111; }
      .axis { stroke: #111111; stroke-width: 2.1; fill: none; }
      .wave { stroke: #111111; stroke-width: 2.8; fill: none; }
      .guide { stroke: #6a6a6a; stroke-width: 1.3; stroke-dasharray: 7 5; fill: none; }
    </style>
  </defs>

  <rect width="1000" height="760" fill="#ffffff"/>
  <text x="500" y="42" text-anchor="middle" class="title">Figure 1.4 Power BJT Switching Waveforms</text>

  <rect x="135" y="95" width="740" height="150" fill="#ffffff" stroke="#111111" stroke-width="1.2"/>
  <rect x="135" y="290" width="740" height="150" fill="#ffffff" stroke="#111111" stroke-width="1.2"/>
  <rect x="135" y="485" width="740" height="150" fill="#ffffff" stroke="#111111" stroke-width="1.2"/>

  <line x1="135" y1="170" x2="885" y2="170" class="axis" marker-end="url(#arrow)"/>
  <line x1="135" y1="365" x2="885" y2="365" class="axis" marker-end="url(#arrow)"/>
  <line x1="135" y1="560" x2="885" y2="560" class="axis" marker-end="url(#arrow)"/>

  <text x="905" y="565" class="label">time</text>
  <text x="58" y="170" class="label">Base current Ib</text>
  <text x="34" y="365" class="label">Collector current Ic</text>
  <text x="20" y="560" class="label">Collector-emitter voltage Vce</text>

  <line x1="220" y1="95" x2="220" y2="635" class="guide"/>
  <line x1="270" y1="95" x2="270" y2="635" class="guide"/>
  <line x1="335" y1="95" x2="335" y2="635" class="guide"/>
  <line x1="575" y1="95" x2="575" y2="635" class="guide"/>
  <line x1="710" y1="95" x2="710" y2="635" class="guide"/>
  <line x1="780" y1="95" x2="780" y2="635" class="guide"/>

  <path d="M 150 170 L 220 170 L 220 130 L 575 130 L 575 170 L 600 170 L 600 205 L 710 205 L 710 170 L 860 170" class="wave"/>
  <text x="175" y="122" class="small">Positive drive</text>
  <text x="613" y="222" class="small">Reverse base-current extraction</text>

  <path d="M 150 365 L 270 365 L 270 365 L 335 320 L 710 320 L 710 320 L 780 365 L 860 365" class="wave"/>
  <text x="365" y="306" class="small">On-state current</text>

  <path d="M 150 515 L 270 515 L 335 600 L 710 600 L 780 515 L 860 515" class="wave"/>
  <text x="377" y="620" class="small">Low Vce in saturation</text>
  <text x="150" y="504" class="small">Off-state Vce</text>
  <text x="788" y="504" class="small">Voltage rises at turn-off</text>

  <line x1="220" y1="82" x2="575" y2="82" class="axis" marker-end="url(#arrow)"/>
  <text x="365" y="72" text-anchor="middle" class="label">Turn-ON interval</text>
  <line x1="575" y1="82" x2="780" y2="82" class="axis" marker-end="url(#arrow)"/>
  <text x="685" y="72" text-anchor="middle" class="label">Turn-OFF interval</text>

  <line x1="220" y1="258" x2="270" y2="258" stroke="#111111" stroke-width="1.6" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="245" y="249" text-anchor="middle" class="small">td</text>

  <line x1="270" y1="258" x2="335" y2="258" stroke="#111111" stroke-width="1.6" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="302" y="249" text-anchor="middle" class="small">tr</text>

  <line x1="575" y1="453" x2="710" y2="453" stroke="#111111" stroke-width="1.6" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="643" y="444" text-anchor="middle" class="small">ts</text>

  <line x1="710" y1="453" x2="780" y2="453" stroke="#111111" stroke-width="1.6" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="745" y="444" text-anchor="middle" class="small">tf</text>

  <text x="208" y="652" class="small">Gate or base command applied</text>
  <text x="560" y="652" class="small">Turn-off command starts</text>
  <text x="702" y="652" class="small">Stored charge removed</text>
</svg>
