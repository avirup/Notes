<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111111"/>
    </marker>
    <style>
      .title { font: 700 24px 'Times New Roman', serif; fill: #111111; }
      .label { font: 18px 'Arial', sans-serif; fill: #111111; }
      .small { font: 15px 'Arial', sans-serif; fill: #111111; }
      .grid { stroke: #d3d3d3; stroke-width: 1; }
      .axis { stroke: #111111; stroke-width: 2.4; fill: none; }
      .main { stroke: #111111; stroke-width: 2.6; fill: none; }
      .alt1 { stroke: #4b4b4b; stroke-width: 2; fill: none; }
      .alt2 { stroke: #6a6a6a; stroke-width: 2; fill: none; stroke-dasharray: 8 5; }
      .alt3 { stroke: #8a8a8a; stroke-width: 2; fill: none; stroke-dasharray: 4 4; }
    </style>
  </defs>

  <rect width="1000" height="680" fill="#ffffff"/>
  <text x="500" y="42" text-anchor="middle" class="title">Figure 1.3 Power BJT Safe Operating Area and RBSOA Context</text>

  <rect x="140" y="110" width="720" height="430" fill="#ffffff" stroke="#111111" stroke-width="1.3"/>

  <line x1="140" y1="540" x2="875" y2="540" class="axis" marker-end="url(#arrow)"/>
  <line x1="140" y1="540" x2="140" y2="95" class="axis" marker-end="url(#arrow)"/>
  <text x="880" y="563" class="label">Collector-emitter voltage Vce (log scale)</text>
  <text x="52" y="105" class="label" transform="rotate(-90 52 105)">Collector current Ic (log scale)</text>

  <line x1="200" y1="110" x2="200" y2="540" class="grid"/>
  <line x1="360" y1="110" x2="360" y2="540" class="grid"/>
  <line x1="560" y1="110" x2="560" y2="540" class="grid"/>
  <line x1="760" y1="110" x2="760" y2="540" class="grid"/>
  <line x1="140" y1="470" x2="860" y2="470" class="grid"/>
  <line x1="140" y1="370" x2="860" y2="370" class="grid"/>
  <line x1="140" y1="250" x2="860" y2="250" class="grid"/>
  <line x1="140" y1="150" x2="860" y2="150" class="grid"/>

  <text x="188" y="566" class="small">0.1</text>
  <text x="352" y="566" class="small">1</text>
  <text x="550" y="566" class="small">10</text>
  <text x="744" y="566" class="small">100</text>

  <text x="112" y="544" class="small">0.1</text>
  <text x="116" y="474" class="small">1</text>
  <text x="110" y="374" class="small">10</text>
  <text x="103" y="254" class="small">100</text>

  <path d="M 160 175 L 445 175" class="main"/>
  <text x="290" y="162" class="small">Current limit</text>

  <path d="M 445 175 L 585 292 L 760 430 L 840 515" class="main"/>
  <text x="600" y="284" class="small">Thermal limit</text>

  <path d="M 515 175 L 655 260 L 770 335 L 840 382" class="alt1"/>
  <text x="682" y="250" class="small">Second breakdown limit</text>

  <path d="M 160 500 L 305 415 L 445 330 L 590 248" class="alt3"/>
  <text x="608" y="246" class="small">DC</text>

  <path d="M 160 450 L 315 360 L 460 275 L 620 190" class="alt2"/>
  <text x="636" y="188" class="small">10 ms</text>

  <path d="M 160 400 L 320 305 L 485 220 L 655 145" class="alt1"/>
  <text x="668" y="145" class="small">1 ms</text>

  <path d="M 160 350 L 330 248 L 505 162 L 700 120" class="main"/>
  <text x="708" y="123" class="small">100 us</text>

  <rect x="615" y="105" width="220" height="150" fill="#f7f7f7" stroke="#111111" stroke-width="1.2"/>
  <text x="725" y="128" text-anchor="middle" class="label">RBSOA context</text>
  <line x1="640" y1="230" x2="815" y2="230" class="axis" marker-end="url(#arrow)"/>
  <line x1="640" y1="230" x2="640" y2="145" class="axis" marker-end="url(#arrow)"/>
  <text x="802" y="247" class="small">Vce</text>
  <text x="626" y="152" class="small">Ic</text>
  <path d="M 665 165 C 700 175, 710 185, 735 190 C 760 197, 780 212, 802 222" class="main" marker-end="url(#arrow)"/>
  <text x="656" y="203" class="small">Turn-off of an</text>
  <text x="656" y="220" class="small">inductive load</text>

  <rect x="175" y="592" width="650" height="50" fill="#f7f7f7" stroke="#111111" stroke-width="1.2"/>
  <text x="500" y="614" text-anchor="middle" class="small">Safe operation lies inside the allowed boundary. Pulse width changes the thermal limit, and second breakdown makes the BJT more restrictive than a simple rectangular current-voltage rating.</text>
</svg>
