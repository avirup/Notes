<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111111"/>
    </marker>
    <style>
      .title { font: 700 24px 'Times New Roman', serif; fill: #111111; }
      .label { font: 18px 'Arial', sans-serif; fill: #111111; }
      .small { font: 15px 'Arial', sans-serif; fill: #111111; }
      .region { font: 700 18px 'Arial', sans-serif; fill: #111111; }
      .line { stroke: #111111; stroke-width: 2; fill: none; }
      .thin { stroke: #111111; stroke-width: 1.4; fill: none; }
      .dash { stroke: #111111; stroke-width: 1.6; stroke-dasharray: 7 5; fill: none; }
    </style>
  </defs>

  <rect width="1000" height="620" fill="#ffffff"/>
  <text x="500" y="42" text-anchor="middle" class="title">Figure 1.1 Vertical NPN Power BJT Cross-Section</text>

  <rect x="180" y="95" width="640" height="410" fill="none" stroke="#111111" stroke-width="2.5"/>

  <rect x="250" y="100" width="90" height="26" fill="#bdbdbd" stroke="#111111" stroke-width="1.5"/>
  <rect x="455" y="100" width="90" height="26" fill="#bdbdbd" stroke="#111111" stroke-width="1.5"/>
  <rect x="660" y="100" width="90" height="26" fill="#bdbdbd" stroke="#111111" stroke-width="1.5"/>
  <text x="500" y="86" text-anchor="middle" class="label">Metal emitter contact</text>

  <rect x="220" y="145" width="560" height="105" fill="#d9d9d9" stroke="#111111" stroke-width="1.8"/>
  <text x="500" y="212" text-anchor="middle" class="region">P base region</text>

  <rect x="270" y="145" width="55" height="78" fill="#6f6f6f" stroke="#111111" stroke-width="1.5"/>
  <rect x="475" y="145" width="55" height="78" fill="#6f6f6f" stroke="#111111" stroke-width="1.5"/>
  <rect x="680" y="145" width="55" height="78" fill="#6f6f6f" stroke="#111111" stroke-width="1.5"/>
  <text x="297" y="188" text-anchor="middle" class="small">N+ emitter</text>
  <text x="502" y="188" text-anchor="middle" class="small">N+ emitter</text>
  <text x="707" y="188" text-anchor="middle" class="small">N+ emitter</text>

  <rect x="220" y="250" width="560" height="180" fill="#f1f1f1" stroke="#111111" stroke-width="1.8"/>
  <text x="500" y="345" text-anchor="middle" class="region">N- collector drift region</text>

  <rect x="220" y="430" width="560" height="45" fill="#c9c9c9" stroke="#111111" stroke-width="1.8"/>
  <text x="500" y="458" text-anchor="middle" class="region">N+ collector substrate</text>

  <rect x="180" y="475" width="640" height="30" fill="#a8a8a8" stroke="#111111" stroke-width="1.8"/>
  <text x="500" y="532" text-anchor="middle" class="label">Collector-side package tab and bottom metal contact</text>

  <rect x="170" y="175" width="38" height="44" fill="#b3b3b3" stroke="#111111" stroke-width="1.5"/>
  <line x1="208" y1="197" x2="220" y2="197" class="line"/>
  <text x="75" y="192" class="label">Base contact</text>
  <line x1="160" y1="190" x2="170" y2="190" class="line" marker-end="url(#arrow)"/>
  <text x="58" y="220" class="small">Base current enters here</text>

  <line x1="220" y1="250" x2="780" y2="250" class="dash"/>
  <line x1="220" y1="145" x2="780" y2="145" class="dash"/>
  <text x="805" y="154" class="small">Emitter-base junction plane</text>
  <text x="805" y="258" class="small">Collector-base junction plane</text>
  <line x1="790" y1="150" x2="780" y2="150" class="thin"/>
  <line x1="790" y1="254" x2="780" y2="254" class="thin"/>

  <line x1="500" y1="455" x2="500" y2="135" class="line" marker-end="url(#arrow)"/>
  <text x="535" y="300" class="label">Collector current path</text>
  <text x="535" y="326" class="small">Conventional current flows from collector to emitter</text>

  <line x1="850" y1="180" x2="850" y2="450" class="line" marker-end="url(#arrow)"/>
  <line x1="880" y1="180" x2="880" y2="450" class="line" marker-end="url(#arrow)"/>
  <line x1="910" y1="180" x2="910" y2="450" class="line" marker-end="url(#arrow)"/>
  <text x="842" y="162" class="label">Heat flow toward collector tab</text>

  <line x1="295" y1="95" x2="295" y2="100" class="line"/>
  <line x1="500" y1="95" x2="500" y2="100" class="line"/>
  <line x1="705" y1="95" x2="705" y2="100" class="line"/>
  <text x="830" y="115" class="label">Emitter terminal</text>
  <line x1="805" y1="120" x2="750" y2="120" class="line" marker-end="url(#arrow)"/>

  <text x="842" y="488" class="label">Collector terminal</text>
  <line x1="820" y1="490" x2="820" y2="490" class="line"/>
  <line x1="820" y1="490" x2="785" y2="490" class="line" marker-end="url(#arrow)"/>

  <rect x="110" y="555" width="780" height="42" fill="#f7f7f7" stroke="#111111" stroke-width="1.3"/>
  <text x="500" y="581" text-anchor="middle" class="small">Large die area, vertical current path, and bottom thermal path help a power BJT carry more current and remove more heat than a small-signal transistor.</text>
</svg>
