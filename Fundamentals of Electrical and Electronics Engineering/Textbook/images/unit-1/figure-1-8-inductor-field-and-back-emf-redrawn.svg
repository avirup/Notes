<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Inductor magnetic field and back EMF</title>
  <desc id="desc">An inductor coil carrying increasing current, surrounded by magnetic field lines, beside a graph showing back EMF opposing a change in current.</desc>
  <defs>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f4f7a"/>
    </marker>
    <marker id="arrowDark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#20242a"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#bf2f2f"/>
    </marker>
    <linearGradient id="core" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#d9e2ec"/>
      <stop offset="0.5" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#b4c1cf"/>
    </linearGradient>
    <style>
      .panel { fill: #fbfcfd; stroke: #d8e1ea; stroke-width: 3; }
      .wire { fill: none; stroke: #20242a; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
      .coil { fill: none; stroke: #143a5a; stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; }
      .field { fill: none; stroke: #1f4f7a; stroke-width: 4; stroke-linecap: round; marker-end: url(#arrowBlue); }
      .axis { stroke: #20242a; stroke-width: 5; stroke-linecap: round; marker-end: url(#arrowDark); }
      .grid { stroke: #d8e1ea; stroke-width: 2; }
      .current { fill: none; stroke: #1f4f7a; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
      .emf { fill: none; stroke: #bf2f2f; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
      .opposing { stroke: #bf2f2f; stroke-width: 6; stroke-linecap: round; marker-end: url(#arrowRed); }
      .label { font: 700 28px Arial, sans-serif; fill: #17212b; }
      .small { font: 600 22px Arial, sans-serif; fill: #334155; }
      .muted { font: 600 18px Arial, sans-serif; fill: #526173; }
      .red { fill: #bf2f2f; }
      .blue { fill: #1f4f7a; }
    </style>
  </defs>

  <rect width="1200" height="520" fill="#ffffff"/>

  <rect class="panel" x="50" y="58" width="690" height="388" rx="18"/>
  <text class="label" x="395" y="108" text-anchor="middle">Inductor Coil and Magnetic Field</text>

  <path class="field" d="M 220 178 C 300 92, 493 92, 573 178"/>
  <path class="field" d="M 175 260 C 272 155, 520 155, 617 260"/>
  <path class="field" d="M 220 342 C 300 428, 493 428, 573 342"/>
  <path class="field" d="M 617 260 C 520 365, 272 365, 175 260"/>
  <text class="small blue" x="395" y="154" text-anchor="middle">Magnetic field, B</text>

  <rect x="231" y="226" width="330" height="68" rx="34" fill="url(#core)" stroke="#6b7886" stroke-width="4"/>
  <path class="wire" d="M 110 260 H 175"/>
  <path class="coil" d="M 175 260 C 175 195 235 195 235 260 C 235 325 295 325 295 260 C 295 195 355 195 355 260 C 355 325 415 325 415 260 C 415 195 475 195 475 260 C 475 325 535 325 535 260 C 535 195 595 195 595 260"/>
  <path class="wire" d="M 595 260 H 675"/>

  <line x1="130" y1="210" x2="247" y2="210" class="axis"/>
  <text class="small" x="188" y="196" text-anchor="middle">i increasing</text>

  <line x1="670" y1="307" x2="565" y2="307" class="opposing"/>
  <text class="small red" x="617" y="340" text-anchor="middle">back EMF opposes change</text>

  <text class="muted" x="395" y="410" text-anchor="middle">Energy is stored in the magnetic field around the coil.</text>

  <rect class="panel" x="790" y="58" width="360" height="388" rx="18"/>
  <text class="label" x="970" y="108" text-anchor="middle">Back EMF During Change</text>

  <g transform="translate(850 145)">
    <line class="grid" x1="0" y1="60" x2="250" y2="60"/>
    <line class="grid" x1="0" y1="140" x2="250" y2="140"/>
    <line class="grid" x1="70" y1="0" x2="70" y2="230"/>
    <line class="grid" x1="160" y1="0" x2="160" y2="230"/>
    <line class="axis" x1="0" y1="230" x2="270" y2="230"/>
    <line class="axis" x1="0" y1="230" x2="0" y2="0"/>
    <text class="small" x="266" y="260" text-anchor="end">time</text>
    <text class="small" x="-10" y="-12" text-anchor="end">value</text>

    <path class="current" d="M 18 190 L 86 150 L 154 110 L 222 70"/>
    <text class="small blue" x="222" y="54" text-anchor="middle">i rises</text>

    <path class="emf" d="M 18 140 C 55 182, 80 204, 112 206 C 148 208, 177 181, 222 130"/>
    <text class="small red" x="148" y="214" text-anchor="middle">v = L di/dt</text>

    <line x1="92" y1="92" x2="92" y2="170" class="opposing"/>
    <text class="muted" x="137" y="91">opposes</text>
    <text class="muted" x="137" y="115">the rise</text>
  </g>

  <text class="muted" x="970" y="407" text-anchor="middle">A faster current change produces a larger opposing voltage.</text>
</svg>
