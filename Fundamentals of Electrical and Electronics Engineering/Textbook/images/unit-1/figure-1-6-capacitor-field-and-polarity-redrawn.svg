<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Parallel-plate capacitor field and electrolytic capacitor polarity</title>
  <desc id="desc">A parallel-plate capacitor with dielectric and electric field arrows, shown beside an electrolytic capacitor with positive and negative polarity markings.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f4f7a"/>
    </marker>
    <linearGradient id="dielectric" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff3c4"/>
      <stop offset="1" stop-color="#f5d978"/>
    </linearGradient>
    <linearGradient id="can" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#dfe5ec"/>
      <stop offset="0.45" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#aab6c2"/>
    </linearGradient>
    <style>
      .panel { fill: #fbfcfd; stroke: #d8e1ea; stroke-width: 3; }
      .wire { fill: none; stroke: #20242a; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
      .plate { fill: #193a5a; stroke: #193a5a; }
      .field { stroke: #1f4f7a; stroke-width: 5; marker-end: url(#arrow); stroke-linecap: round; }
      .label { font: 700 28px Arial, sans-serif; fill: #17212b; }
      .small { font: 600 22px Arial, sans-serif; fill: #334155; }
      .muted { font: 600 18px Arial, sans-serif; fill: #526173; }
      .charge-plus { fill: #c62828; font: 700 34px Arial, sans-serif; }
      .charge-minus { fill: #1e5aa8; font: 700 34px Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1200" height="520" fill="#ffffff"/>

  <rect class="panel" x="50" y="58" width="680" height="388" rx="18"/>
  <text class="label" x="390" y="108" text-anchor="middle">Parallel-Plate Capacitor</text>

  <rect x="265" y="150" width="255" height="226" rx="8" fill="url(#dielectric)" stroke="#d1a022" stroke-width="3"/>
  <text class="small" x="392" y="407" text-anchor="middle">Dielectric material</text>

  <rect class="plate" x="225" y="126" width="24" height="276" rx="5"/>
  <rect class="plate" x="536" y="126" width="24" height="276" rx="5"/>

  <path class="wire" d="M 237 126 V 92 H 124 V 222"/>
  <path class="wire" d="M 548 126 V 92 H 652 V 222"/>
  <path class="wire" d="M 124 296 V 402 H 237"/>
  <path class="wire" d="M 652 296 V 402 H 548"/>

  <line class="field" x1="287" y1="186" x2="499" y2="186"/>
  <line class="field" x1="287" y1="238" x2="499" y2="238"/>
  <line class="field" x1="287" y1="290" x2="499" y2="290"/>
  <line class="field" x1="287" y1="342" x2="499" y2="342"/>
  <text class="small" x="392" y="164" text-anchor="middle" fill="#1f4f7a">Electric field, E</text>

  <text class="charge-plus" x="180" y="190" text-anchor="middle">+Q</text>
  <text class="charge-minus" x="605" y="190" text-anchor="middle">-Q</text>

  <g transform="translate(95 222)">
    <line x1="0" y1="0" x2="58" y2="0" stroke="#20242a" stroke-width="7" stroke-linecap="round"/>
    <line x1="12" y1="52" x2="46" y2="52" stroke="#20242a" stroke-width="7" stroke-linecap="round"/>
    <text class="charge-plus" x="76" y="-24">+</text>
    <text class="charge-minus" x="76" y="77">-</text>
    <text class="small" x="-2" y="124">DC source</text>
  </g>

  <text class="muted" x="392" y="443" text-anchor="middle">Charge is stored on the plates; energy is stored in the electric field.</text>

  <rect class="panel" x="780" y="58" width="370" height="388" rx="18"/>
  <text class="label" x="965" y="108" text-anchor="middle">Electrolytic Capacitor</text>

  <g transform="translate(885 137)">
    <rect x="0" y="28" width="154" height="220" rx="26" fill="url(#can)" stroke="#4b5563" stroke-width="4"/>
    <rect x="103" y="28" width="51" height="220" rx="0" fill="#2f3b46" opacity="0.88"/>
    <text x="128" y="86" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#ffffff">-</text>
    <text x="128" y="132" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#ffffff">-</text>
    <text x="128" y="178" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#ffffff">-</text>
    <ellipse cx="77" cy="28" rx="77" ry="25" fill="#eef3f8" stroke="#4b5563" stroke-width="4"/>
    <ellipse cx="77" cy="248" rx="77" ry="24" fill="#bac5cf" stroke="#4b5563" stroke-width="4"/>
    <line x1="43" y1="272" x2="43" y2="338" stroke="#20242a" stroke-width="8" stroke-linecap="round"/>
    <line x1="113" y1="272" x2="113" y2="316" stroke="#20242a" stroke-width="8" stroke-linecap="round"/>
    <text class="charge-plus" x="24" y="370">+</text>
    <text class="charge-minus" x="98" y="370">-</text>
  </g>

  <path d="M 840 250 H 812" class="wire"/>
  <text class="small" x="808" y="238" text-anchor="end">Connect to +</text>
  <path d="M 1070 250 H 1100" class="wire"/>
  <text class="small" x="1105" y="238">Negative stripe</text>
  <text class="muted" x="965" y="407" text-anchor="middle">Polarised part: observe the marked + and - leads.</text>
</svg>
